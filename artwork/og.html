<!doctype html>
<html lang="en" data-air-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Cloakyard social artwork</title>
    <link rel="stylesheet" href="../design/air/air.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--air-page);
        color: var(--air-ink);
        font-family: var(--air-font);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 40px 64px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      header span:last-child {
        margin-left: auto;
        color: var(--air-ink-muted);
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0;
      }
      main {
        text-align: center;
        padding-top: 24px;
      }
      p {
        margin: 0;
        color: var(--air-ink-secondary);
        font-size: 16px;
      }
      h1 {
        font-size: 72px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.065em;
        margin: 24px 0;
      }
      h1 span {
        display: block;
        color: var(--air-ink-secondary);
      }
      .air-horizon {
        position: absolute;
        left: 32px;
        top: 340px;
        width: 1136px;
        height: 200px;
      }
      footer {
        position: absolute;
        bottom: 48px;
        left: 64px;
        right: 64px;
        display: flex;
        justify-content: space-between;
        gap: 32px;
        border-top: 1px solid var(--air-line);
        padding-top: 24px;
        font-size: 20px;
        letter-spacing: -0.025em;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../public/cloakyard-mark.svg" width="32" height="32" alt="" />Cloakyard<span
        >cloakyard.com</span
      >
    </header>
    <main>
      <p>Private by nature. Open by choice.</p>
      <h1>Your work.<span>A little lighter.</span></h1>
    </main>
    <svg
      class="air-horizon"
      viewBox="0 0 1200 240"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <linearGradient id="home-plane" x2="0" y2="1">
          <stop stop-color="var(--air-surface-soft)" stop-opacity="0.8" />
          <stop offset="1" stop-color="var(--air-surface-soft)" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="home-edge-fade">
          <stop stop-color="white" stop-opacity="0" />
          <stop offset="0.2" stop-color="white" />
          <stop offset="0.8" stop-color="white" />
          <stop offset="1" stop-color="white" stop-opacity="0" />
        </linearGradient>
        <mask id="home-horizon-mask">
          <rect width="1200" height="240" fill="url(#home-edge-fade)" />
        </mask>
      </defs>
      <g mask="url(#home-horizon-mask)">
        <path d="M0 100Q600 84 1200 145V240H0Z" fill="url(#home-plane)" />
        <path
          d="M0 100Q600 84 1200 145"
          fill="none"
          stroke="var(--air-accent)"
          stroke-opacity="0.22"
        />
        <path d="M0 182Q600 132 1200 139V240H0Z" fill="url(#home-plane)" />
        <path
          d="M0 182Q600 132 1200 139"
          fill="none"
          stroke="var(--air-accent)"
          stroke-opacity="0.28"
        />
      </g>
    </svg>
    <footer>
      <span>CloakPDF</span><span>CloakResume</span><span>CloakIMG</span><span>CloakDrop</span>
    </footer>
  </body>
</html>
