<!doctype html>
<html lang="en" data-air-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Cloakyard social artwork</title>
    <link rel="stylesheet" href="../design/air/air.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--air-page);
        color: var(--air-ink);
        font-family: var(--air-font);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 40px 64px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      header span:last-child {
        margin-left: auto;
        color: var(--air-ink-muted);
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0;
      }
      main {
        text-align: center;
        padding-top: 24px;
      }
      p {
        margin: 0;
        color: var(--air-ink-secondary);
        font-size: 16px;
      }
      h1 {
        font-size: 72px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.065em;
        margin: 24px 0;
      }
      h1 span {
        display: block;
        color: var(--air-ink-secondary);
      }
      .family-art {
        position: absolute;
        inset: 385px 64px auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 32px;
        justify-items: center;
        align-items: center;
      }
      .family-art img {
        width: 72px;
        height: 72px;
      }
      footer {
        position: absolute;
        bottom: 48px;
        left: 64px;
        right: 64px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        text-align: center;
        gap: 32px;
        border-top: 1px solid var(--air-line);
        padding-top: 24px;
        font-size: 20px;
        letter-spacing: -0.025em;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../public/cloakyard-mark.svg" width="32" height="32" alt="" />Cloakyard<span
        >cloakyard.com</span
      >
    </header>
    <main>
      <p>Private by nature. Open by choice.</p>
      <h1>Your work.<span>A little lighter.</span></h1>
    </main>
    <div class="family-art" aria-hidden="true">
      <img src="../public/brands/cloakpdf-mark.svg" alt="" />
      <img src="../public/brands/cloakresume-mark.svg" alt="" />
      <img src="../public/brands/cloakimg-mark.svg" alt="" />
      <img src="../public/brands/cloakdrop-mark.svg" alt="" />
      <img src="../public/brands/cloakroll-mark.svg" alt="" />
    </div>
    <footer>
      <span>CloakPDF</span><span>CloakResume</span><span>CloakIMG</span><span>CloakDrop</span
      ><span>CloakRoll</span>
    </footer>
  </body>
</html>
