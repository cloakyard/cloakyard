<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">CloakPDF · Page stack</title>
  <desc id="description">Two offset sheets replace the shield. The three white lines keep their original lengths and positions.</desc>
  <defs>
    <view id="light" viewBox="0 0 64 64"/>
    <view id="dark" viewBox="0 0 64 64"/>
    <view id="ink" viewBox="0 0 64 64"/>
    <view id="ground-light" viewBox="0 0 64 64"/>
    <view id="ground-dark" viewBox="0 0 64 64"/>
    <view id="back-light" viewBox="0 0 64 64"/>
    <view id="back-dark" viewBox="0 0 64 64"/>
    <view id="page-light" viewBox="0 0 64 64"/>
    <view id="page-dark" viewBox="0 0 64 64"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display:none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display:none }
      svg:has(#back-light:target, #back-dark:target) > g:not(#back) { display:none }
      svg:has(#page-light:target, #page-dark:target) > g:not(#page) { display:none }
      [fill="#285bc8"] { fill:light-dark(#285bc8,#305cc0) }
      svg:has(#ink:target) #ground circle { fill:#263446 }
      svg:has(#ink:target) .face { fill:#fff }
      svg:has(#ink:target) .return { fill:#263446 }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Blue field">
    <circle cx="32" cy="32" r="30" fill="#285bc8"/>
  </g>
  <g id="back" inkscape:groupmode="layer" inkscape:label="Rear sheet">
    <path class="face" fill="#b6d4ff" d="M14.2 20.65h2.95v26.7q0 1.2 1.2 1.2h23.4v2.95H17.9a3.7 3.7 0 0 1-3.7-3.7Z"/>
  </g>
  <g id="page" inkscape:groupmode="layer" inkscape:label="Printed sheet">
    <path class="face" fill="#fff" fill-rule="evenodd" d="M22.4 12.35H37.9l10.9 10.9v19.9a3.2 3.2 0 0 1-3.2 3.2H22.4a3.2 3.2 0 0 1-3.2-3.2v-27.6a3.2 3.2 0 0 1 3.2-3.2Zm-.05 3.15V43.2h23.3V24.65h-6.7a3.3 3.3 0 0 1-3.3-3.3V15.5Zm16.1 1.45v4.22q0 .62.62.62h4.22Z"/>
    <path class="face" fill="#fff" d="M24.95 26.45h15.65v2.65H24.95Zm0 6.07h12.1v2.65h-12.1Zm0 6.07h8.64v2.65h-8.64Z"/>
  </g>
</svg>
