<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">CloakPDF · Page turn</title>
  <desc id="description">Three lines cut into a blue page. A darker, upturned corner reveals a second sheet.</desc>
  <defs>
    <mask id="type" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="white"/><path d="M19 22.8h16.8m-16.8 6.3h12.8m-12.8 6.3h8.8" fill="none" stroke="black" stroke-width="2.9" stroke-linecap="round"/></mask>
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="white"/><path transform="rotate(-7 32 32)" d="M12.8 9h36.4v23.3C46.72 35.14 42.45 36.93 35.04 35.1c.77 8.54-2.4 14.32-9.86 19.6H12.8Z" fill="black" stroke="black" stroke-width="1.75"/><path transform="rotate(-7 32 32)" d="M36 35.8c6 2 10 1 13-2m-22.2 21c7.1-5.3 9.8-11.9 9.2-19Z" stroke="black" stroke-width="2" fill="none"/></mask>
    <view id="light" viewBox="0 0 64 64"/>
    <view id="dark" viewBox="0 0 64 64"/>
    <view id="ink" viewBox="0 0 64 64"/>
    <view id="ground-light" viewBox="0 0 64 64"/>
    <view id="ground-dark" viewBox="0 0 64 64"/>
    <view id="page-light" viewBox="0 0 64 64"/>
    <view id="page-dark" viewBox="0 0 64 64"/>
    <view id="curl-tip-light" viewBox="0 0 64 64"/>
    <view id="curl-tip-dark" viewBox="0 0 64 64"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display: none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      svg:has(#page-light:target, #page-dark:target) > g:not(#page) { display: none }
      svg:has(#curl-tip-light:target, #curl-tip-dark:target) > g:not(#curl-tip) { display: none }
      [fill="#182f69"] { fill: light-dark(#182f69, #5286df) }
      [fill="#3367ce"] { fill: light-dark(#3367ce, #88b0fb) }
      [fill="#84a6e6"] { fill: light-dark(#84a6e6, #7d9ac9) }
      svg:has(#ink:target) [data-ink] { fill: light-dark(#253346, #e6edf7) }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Lower page">
    <path mask="url(#behind)" data-ink="" fill="#84a6e6" d="M15 17.3 49.4 12.8l3.37 39.1-34.4 3.8Z"/>
  </g>
  <g id="page" inkscape:groupmode="layer" inkscape:label="Printed page">
    <g transform="rotate(-7 32 32)" mask="url(#type)"><path data-ink="" fill="#3367ce" d="M12.8 9h36.4v23.3C46.72 35.14 42.45 36.93 35.04 35.1c.77 8.54-2.4 14.32-9.86 19.6H12.8Z"/></g>
  </g>
  <g id="curl-tip" inkscape:groupmode="layer" inkscape:label="Paper turn">
    <path transform="rotate(-7 32 32)" data-ink="" fill="#182f69" d="M36.79 37.07c5.25.99 9.49.27 12.25-2.04-2.84 8.27-10.7 16-19.66 19.18 5.12-4.46 7.81-10.68 7.41-17.14Z"/>
  </g>
</svg>
