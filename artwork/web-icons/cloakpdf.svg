<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">CloakPDF · Bound report</title>
  <desc id="description">A cobalt-bound report with warm paper, a narrow amber bookmark, short printed lines and a ruled table.</desc>
  <defs>
    <view id="light" viewBox="0 0 256 256"/>
    <view id="dark" viewBox="0 0 256 256"/>
    <view id="ink" viewBox="0 0 256 256"/>
    <view id="ground-light" viewBox="0 0 256 256"/>
    <view id="ground-dark" viewBox="0 0 256 256"/>
    <view id="page-light" viewBox="0 0 256 256"/>
    <view id="page-dark" viewBox="0 0 256 256"/>
    <view id="print-light" viewBox="0 0 256 256"/>
    <view id="print-dark" viewBox="0 0 256 256"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display: none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      svg:has(#page-light:target, #page-dark:target) > g:not(#page) { display: none }
      svg:has(#print-light:target, #print-dark:target) > g:not(#print) { display: none }
      svg {
        --ink: light-dark(#163675, #183970);
        --muted: light-dark(#6783aa, #637fa9);
        --grid: light-dark(#335da5, #315995);
        --cell: light-dark(#eef4fb, #e2ecf7);
        --leaf: light-dark(#fffef6, #f6f5ed);
        --foot: light-dark(#e7e5d7, #d9ddde);
        --fold: light-dark(#b8cee4, #aec4de);
        --crease: light-dark(#7c9ab9, #8ba6c3);
        --cover: light-dark(#2253af, #1d447f);
        --lip: light-dark(#5989df, #4d79bb);
        --deep: light-dark(#183b7b, #112a51);
        --amber: light-dark(#ffc66c, #ffbe61);
        --amberedge: light-dark(#bf7a28, #cc8734);
        --sky: light-dark(#f6f6f1, #424f65);
        --base: light-dark(#e4e9ee, #263047);
        --rim: light-dark(#d1d9e0, #53647b);
      }
      svg:has(#ink:target) {
        --ink: #202832;
        --muted: #202832;
        --grid: #202832;
        --cell: white;
        --leaf: white;
        --foot: white;
        --fold: white;
        --crease: #202832;
        --cover: #202832;
        --lip: #202832;
        --deep: #202832;
        --amber: white;
        --amberedge: #202832;
      }
      svg:has(#ink:target) .tile, svg:has(#ink:target) .shadow { display: none }
    </style>
    <linearGradient id="field" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="var(--sky)"/>
      <stop offset="1" stop-color="var(--base)"/>
    </linearGradient>
    <linearGradient id="stock" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="var(--leaf)"/>
      <stop offset="0.68" stop-color="var(--leaf)"/>
      <stop offset="1" stop-color="var(--foot)"/>
    </linearGradient>
    <linearGradient id="binding" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="var(--lip)"/>
      <stop offset="1" stop-color="var(--cover)"/>
    </linearGradient>
    <filter id="cast" x="-25%" y="-20%" width="150%" height="155%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Cloth cover">
    <path class="tile" d="M128 8C181 8 207 8 226 27S246 72 246 126v4c0 54 0 80-19 99s-46 19-99 19-80 0-99-19S10 184 10 130v-4c0-54 0-80 19-99S75 8 128 8Z" fill="url(#field)" stroke="var(--rim)" stroke-width="1.5"/>
    <g transform="rotate(-5 128 128)">
      <rect class="shadow" x="58" y="42" width="148" height="181" rx="12" fill="#263855" opacity=".25" filter="url(#cast)"/>
      <rect x="52" y="39" width="149" height="177" rx="11" fill="var(--deep)"/>
      <rect x="52" y="36" width="148" height="177" rx="10" fill="url(#binding)" stroke="var(--deep)" stroke-width="1.5"/>
      <path d="M68 38v173" stroke="var(--deep)" opacity=".55" stroke-width="2"/>
      <path d="M71 38v173" stroke="var(--lip)" stroke-width="2"/>
    </g>
  </g>
  <g id="page" inkscape:groupmode="layer" inkscape:label="Leaves and ribbon">
    <g transform="rotate(-5 128 128)">
      <path d="M82 54h104v152H84q-6 0-6-6V60q0-6 4-6Z" fill="var(--fold)" stroke="var(--crease)" stroke-width="1.5"/>
      <path d="M82 49h103v154H83q-6 0-6-6V55q0-6 5-6Z" fill="var(--foot)" stroke="var(--crease)" stroke-width="1.3"/>
      <path d="M148 182h15v37l-7.5-5-7.5 5Z" fill="var(--amber)" stroke="var(--amberedge)" stroke-width="1.4"/>
      <path d="M80 43q7 0 14 2h84q6 0 6 6v145h-86q-10-2-18-1Z" fill="url(#stock)" stroke="var(--crease)" stroke-width="1.4"/>
      <path d="M84 46v146" stroke="var(--foot)" stroke-width="2"/>
    </g>
  </g>
  <g id="print" inkscape:groupmode="layer" inkscape:label="Printed lines and table">
    <g transform="rotate(-5 128 128)">
      <path d="M95 69h45" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
      <path d="M95 84h64" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>
      <path d="M95 93h45" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>
      <rect x="93" y="107" width="75" height="56" rx="2" fill="var(--cell)" stroke="var(--grid)" stroke-width="3"/>
      <path d="M93 118v-9q0-2 2-2h71q2 0 2 2v9Z" fill="var(--grid)"/>
      <path d="M124 118v45M93 140.5h75" fill="none" stroke="var(--grid)" stroke-width="3"/>
      <path d="M124 108v10" stroke="var(--cell)" stroke-width="2.3"/>
      <path d="M100 112.5h10.26M129 112.5h17.68" fill="none" stroke="var(--cell)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M100 129.25h12.6M100 151.75h9.24M162 129.25h-14.4M162 151.75h-19.84" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
      <path d="M95 175h39" stroke="var(--muted)" stroke-linecap="round" stroke-width="3.5"/>
    </g>
  </g>
</svg>
