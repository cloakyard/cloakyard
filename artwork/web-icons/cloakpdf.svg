<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">CloakPDF · Document shield</title>
  <desc id="description">Three blue lines sit on a white paper shield. Two thin page edges show beneath the front sheet.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#71b5ff"/>
      <stop offset=".47" stop-color="#2b69eb"/>
      <stop offset="1" stop-color="#1947b0"/>
    </linearGradient>
    <linearGradient id="rim" x1=".24" y1="0" x2=".76" y2="1">
      <stop stop-color="#fff" stop-opacity=".88"/><stop offset=".39" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#0a1540" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity=".46"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".24" cy=".16" r=".8">
      <stop stop-color="#fff" stop-opacity=".27"/><stop offset=".68" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="contact" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><feGaussianBlur stdDeviation="1.05"/></filter>
    <path id="outline" d="M32 12.1 48.2 18.7v13.6c0 8.6-5.4 15.2-16.2 20.4-10.8-5.2-16.2-11.8-16.2-20.4V18.7L32 12.1Z"/>
    <linearGradient id="paper" x1=".1" y1=".03" x2=".85" y2=".98">
      <stop stop-color="#fffefb"/><stop offset=".43" stop-color="#f5f8ff"/><stop offset=".8" stop-color="#d6e7ff"/><stop offset="1" stop-color="#afc9ee"/>
    </linearGradient>
    <linearGradient id="fold" x1=".2" y1=".9" x2=".9" y2=".1">
      <stop stop-color="#e3efff"/><stop offset=".5" stop-color="#b9d3f4"/><stop offset="1" stop-color="#89b0e0"/>
    </linearGradient>
    <linearGradient id="ink" x2=".9" y2=".65"><stop stop-color="#2456a4"/><stop offset="1" stop-color="#416dba"/></linearGradient>
    <path id="lines" d="M23.9 26.8h16.2m-16.2 6.7h12.5m-12.5 6.6h8.9"/>
    <view id="light" viewBox="0 0 64 64"/>
    <view id="dark" viewBox="0 0 64 64"/>
    <view id="ground-light" viewBox="0 0 64 64"/>
    <view id="ground-dark" viewBox="0 0 64 64"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, #ground-light:target) { color-scheme: light }
      svg:has(#dark:target, #ground-dark:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target),
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      #enamel stop:nth-child(1) { stop-color: light-dark(#71b5ff, #355fa1) }
      #enamel stop:nth-child(2) { stop-color: light-dark(#2b69eb, #203e8a) }
      #enamel stop:nth-child(3) { stop-color: light-dark(#1947b0, #172757) }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="01 · Enamel disc">
    <circle cx="32" cy="32" r="30" fill="url(#enamel)"/>
    <circle cx="32" cy="32" r="29.5" fill="url(#bloom)" stroke="url(#rim)" stroke-width="1"/>
  </g>
  <g id="leaves" inkscape:groupmode="layer" inkscape:label="02 · Page edges">
    <use href="#outline" transform="translate(.6 2.55)" fill="#0a2a6b" opacity=".56" filter="url(#contact)"/>
    <g stroke-linejoin="round" stroke-width="1.5">
      <use href="#outline" transform="translate(1.15 1.65)" fill="#c8dcfc" stroke="#a8c7f1"/>
      <use href="#outline" transform="translate(.65 .9)" fill="#5587c4" stroke="#5b88c0"/>
    </g>
  </g>
  <g id="sheet" inkscape:groupmode="layer" inkscape:label="03 · Shield-shaped sheet">
    <use href="#outline" fill="url(#paper)" stroke="#f4faff" stroke-width="1.18" stroke-linejoin="round"/>
    <path d="m16.6 19.05 15.45-6.25 13.6 5.5" fill="none" stroke="#fff" stroke-width=".56" stroke-linecap="round"/>
    <path d="m40.55 15.62 7.65 3.08v6.03Z" fill="#afcaed"/>
    <path d="M40.55 15.62q1.05 3.75.05 6.72 3.65-.56 7.6 2.39Z" fill="#739bc9" opacity=".46" transform="translate(.04 .36)"/>
    <path d="M40.55 15.62q1.05 3.75.05 6.72 3.65-.56 7.6 2.39Z" fill="url(#fold)"/>
    <path d="m40.55 15.62 7.65 9.11" fill="none" stroke="#f8fbff" stroke-width=".42"/>
    <path d="M47.5 31c0 8.6-5.15 15.1-15.5 20.4" fill="none" stroke="#94b5e0" stroke-width=".47" stroke-linecap="round"/>
  </g>
  <g id="type" inkscape:groupmode="layer" inkscape:label="04 · Printed lines">
    <use href="#lines" transform="translate(0 .44)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <use href="#lines" fill="none" stroke="url(#ink)" stroke-width="2.9" stroke-linecap="round"/>
  </g>
</svg>
