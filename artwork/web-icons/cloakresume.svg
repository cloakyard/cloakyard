<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">CloakResume · The writing folio</title>
  <desc id="description">A brass fountain-pen nib sits on a green cloth portfolio. Cream pages and a vermilion ribbon peek out below the cover.</desc>
  <defs>
    <linearGradient id="sage" x2=".9" y2="1"><stop stop-color="#f1f6df"/><stop offset=".57" stop-color="#dce6cd"/><stop offset="1" stop-color="#adbfb1"/></linearGradient>
    <linearGradient id="linen" x2=".9" y2="1"><stop stop-color="#52a389"/><stop offset=".31" stop-color="#328578"/><stop offset=".72" stop-color="#19665d"/><stop offset="1" stop-color="#104d49"/></linearGradient>
    <linearGradient id="spine" x2="1" y2="0"><stop stop-color="#165a52"/><stop offset=".36" stop-color="#549a81"/><stop offset=".7" stop-color="#237568"/><stop offset="1" stop-color="#165b52"/></linearGradient>
    <linearGradient id="gold" x1="0" y1=".25" x2="1" y2=".75"><stop stop-color="#8a5428"/><stop offset=".21" stop-color="#d9a452"/><stop offset=".42" stop-color="#ffdc8c"/><stop offset=".57" stop-color="#fff1ae"/><stop offset=".8" stop-color="#d49b43"/><stop offset="1" stop-color="#ae732f"/></linearGradient>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 1h3M1 0v1.4" fill="none" stroke="#e3f5d7" stroke-width=".6" opacity=".09"/></pattern>
    <filter id="shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="4"/></filter>
    <view id="light" viewBox="0 0 256 256"/>
    <view id="dark" viewBox="0 0 256 256"/>
    <view id="ground-light" viewBox="0 0 256 256"/>
    <view id="ground-dark" viewBox="0 0 256 256"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, #ground-light:target) { color-scheme: light }
      svg:has(#dark:target, #ground-dark:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target),
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      #sage stop:nth-child(1) { stop-color: light-dark(#f1f6df, #3a524b) }
      #sage stop:nth-child(2) { stop-color: light-dark(#dce6cd, #243a33) }
      #sage stop:nth-child(3) { stop-color: light-dark(#adbfb1, #142822) }
      #ground > rect:nth-of-type(2) { stroke: light-dark(#668871, #9cbe9f) }
      #ground > path { stroke: light-dark(#fff9ed, #7e899c); opacity: .6 }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="01 · Sage ground">
    <rect x="5" y="5" width="246" height="246" rx="54" fill="url(#sage)"/>
    <rect x="6" y="6" width="244" height="244" rx="53" fill="none" stroke="#668871" stroke-opacity=".33"/>
    <path d="M12 76V60c0-29 19-47 47-48h75" fill="none" stroke="#fcffe9" stroke-width="2" opacity=".83"/>
  </g>
  <g id="leaves" inkscape:groupmode="layer" inkscape:label="02 · Paper and ribbon">
    <g transform="rotate(-10 128 128)">
      <rect x="65" y="44" width="143" height="172" rx="14" fill="#3c594f" opacity=".33" filter="url(#shadow)"/>
      <rect x="58" y="40" width="143" height="172" rx="12" fill="#0c4944"/>
      <path d="M64 189h118l9-146q7 0 7 8v147q0 9-10 9H72q-9 0-12-6Z" fill="#d0b68e"/>
      <path d="m65 188 117-1 7-145q6 0 6 7v146q0 8-9 8H70q-9 0-10-6Z" fill="#fff2cd"/>
      <path d="M68 199h114q8 0 8-8m-116 13h112" fill="none" stroke="#c1a47a" stroke-width="1.1"/>
      <path d="M151 197h18v28l-9-7-9 6Z" fill="#ba4e39"/>
      <path d="M152 199h3v22l-3 2Z" fill="#fcad79"/>
    </g>
  </g>
  <g id="cover" inkscape:groupmode="layer" inkscape:label="03 · Book cloth">
    <g transform="rotate(-10 128 128)">
      <rect x="55" y="33" width="137" height="164" rx="11" fill="#104c49"/>
      <rect x="55" y="31" width="136" height="163" rx="11" fill="url(#linen)"/>
      <rect x="55" y="31" width="136" height="163" rx="11" fill="url(#weave)"/>
      <path d="M67 31h7v163h-7q-12 0-12-12V43q0-12 12-12Z" fill="url(#spine)"/>
      <path d="M74 32v161" stroke="#124e48" stroke-width="2"/>
      <path d="M77 33v158" stroke="#77b39a" stroke-opacity=".65"/>
      <rect x="84" y="41" width="96" height="141" rx="5" fill="none" stroke="#b3ca91" stroke-opacity=".52" stroke-width="1.2"/>
      <path d="M59 45q0-10 10-10h110" fill="none" stroke="#96c7a5" stroke-width="1.6" opacity=".76"/>
    </g>
  </g>
  <g id="nib" inkscape:groupmode="layer" inkscape:label="04 · Brass pen nib">
    <g transform="rotate(20 134 113)">
      <path d="M134 53q15 26 29 41c-2 29-12 41-15 56h-28c-3-15-13-27-15-56q14-15 29-41Z" fill="#103c3a" opacity=".7" transform="translate(3 5)" filter="url(#shadow)"/>
      <path d="M134 47q16 27 30 42c-2 29-13 42-16 58h-28c-3-16-14-29-16-58q14-15 30-42Z" fill="#936227"/>
      <path d="M134 45c9 17 19 32 30 42-2 28-13 42-16 57h-28c-3-15-14-29-16-57 11-10 21-25 30-42Z" fill="url(#gold)"/>
      <path d="M134 48c-4 17-13 30-21 40 1 19 5 28 10 40-11-15-16-29-17-40 10-10 21-26 28-40Z" fill="#ffe8a3" opacity=".72"/>
      <path d="M134 45v49" stroke="#61472c" stroke-width="2"/>
      <circle cx="134" cy="97" r="6" fill="#845c32"/><circle cx="134" cy="96" r="4.8" fill="#164d47"/>
      <path d="M114 97c4 13 10 23 20 28 10-6 17-16 20-28m-36 20q7 11 16 16 10-6 16-16" fill="none" stroke="#996d36" stroke-width="1.5"/>
      <path d="M121 142h26" stroke="#fff2b7" stroke-width="2"/>
      <path d="M120 147h28l-1 9h-26Z" fill="#123e3a"/>
      <path d="M121 149h26" stroke="#eac47e" stroke-width="2"/>
    </g>
  </g>
</svg>
