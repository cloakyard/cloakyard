<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">CloakResume · Index card</title>
  <desc id="description">An emerald index card holds a portrait and four cut lines of type.</desc>
  <defs>
    <mask id="profile-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="white"/><circle cx="22" cy="27" r="3.3"/><path d="M16.45 34.5q.75-4.1 5.55-4.1t5.55 4.1q-5.55 1.45-11.1 0Z"/><path d="M32.5 27h12m-12 5.5h8.8m-23.8 7.3h27m-27 4.2h18.1" fill="none" stroke="black" stroke-width="2.15" stroke-linecap="round"/></mask>
    <mask id="index-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="white"/><path d="M9.5 20.2v-4.1q0-1.4 1.4-1.4h12.75c1.9 0 2.82 4.1 4.85 4.1h24.55q1.45 0 1.45 1.45v28.4q0 1.45-1.45 1.45H10.95q-1.45 0-1.45-1.45Z" stroke="black" stroke-width="1.6"/></mask>
    <view id="light" viewBox="0 0 64 64"/>
    <view id="dark" viewBox="0 0 64 64"/>
    <view id="ink" viewBox="0 0 64 64"/>
    <view id="ground-light" viewBox="0 0 64 64"/>
    <view id="ground-dark" viewBox="0 0 64 64"/>
    <view id="divider-light" viewBox="0 0 64 64"/>
    <view id="divider-dark" viewBox="0 0 64 64"/>
    <view id="face-light" viewBox="0 0 64 64"/>
    <view id="face-dark" viewBox="0 0 64 64"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display: none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      svg:has(#divider-light:target, #divider-dark:target) > g:not(#divider) { display: none }
      svg:has(#face-light:target, #face-dark:target) > g:not(#face) { display: none }
      [fill="#1a7656"] { fill: light-dark(#1a7656, #76c49f) }
      [fill="#389a73"] { fill: light-dark(#389a73, #70b592) }
      [fill="#74b597"] { fill: light-dark(#74b597, #9ed0b3) }
      svg:has(#ink:target) [data-ink] { fill: light-dark(#253346, #e6edf7) }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Rear tab">
    <g transform="rotate(-5 32 32)" mask="url(#index-edge)"><path data-ink="" fill="#74b597" d="M14.1 19.3h24.7c1.7 0 2.24-5.78 4.17-5.78h6.7q1.7 0 1.7 1.55v30.6H14.1Z"/></g>
  </g>
  <g id="divider" inkscape:groupmode="layer" inkscape:label="Middle tab">
    <g transform="rotate(-5 32 32)" mask="url(#index-edge)"><path data-ink="" fill="#389a73" d="M13.6 19.3h12.6c1.84 0 2.58-5.04 4.25-5.04h7.03q1.7 0 1.7 1.55v28.1H13.6Z"/></g>
  </g>
  <g id="face" inkscape:groupmode="layer" inkscape:label="Profile card">
    <path transform="rotate(-5 32 32)" data-ink="" fill="#1a7656" mask="url(#profile-cut)" d="M9.5 20.2v-4.1q0-1.4 1.4-1.4h12.75c1.9 0 2.82 4.1 4.85 4.1h24.55q1.45 0 1.45 1.45v28.4q0 1.45-1.45 1.45H10.95q-1.45 0-1.45-1.45Z"/>
  </g>
</svg>
