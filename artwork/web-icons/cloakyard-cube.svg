<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="-126 -89 252 252" role="img" aria-labelledby="title description">
  <title id="title">Cloakyard · Touchdown</title>
  <desc id="description">Four cubes form a low platform. A fifth cube descends towards its back corner.</desc>
  <defs>
    <view id="light" viewBox="-126 -89 252 252"/>
    <view id="dark" viewBox="-126 -89 252 252"/>
    <view id="ink" viewBox="-126 -89 252 252"/>
    <view id="ground-light" viewBox="-126 -89 252 252"/>
    <view id="ground-dark" viewBox="-126 -89 252 252"/>
    <view id="front-light" viewBox="-126 -89 252 252"/>
    <view id="front-dark" viewBox="-126 -89 252 252"/>
    <view id="arrival-light" viewBox="-126 -89 252 252"/>
    <view id="arrival-dark" viewBox="-126 -89 252 252"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display: none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      svg:has(#front-light:target, #front-dark:target) > g:not(#front) { display: none }
      svg:has(#arrival-light:target, #arrival-dark:target) > g:not(#arrival) { display: none }
      svg {
        --roof: light-dark(#c7dbff, #9bd2ff);
        --west: light-dark(#76a5fb, #578fc9);
        --east: light-dark(#315fd3, #2879bc);
        --join: light-dark(#eaf2ff, #183b5a);
      }
      svg:has(#ink:target) {
        --roof: #fff;
        --west: #fff;
        --east: #202832;
        --join: #202832;
      }
      .cell { stroke: var(--join); stroke-width: 1.6; stroke-linejoin: round }
      .west { fill: var(--west) }
      .east { fill: var(--east) }
      .roof { fill: var(--roof) }
    </style>
    <g id="block" class="cell">
      <path class="west" d="M-48 24 0 48V104L-48 80Z"/>
      <path class="east" d="M0 48 48 24V80L0 104Z"/>
      <path class="roof" d="M0 0 48 24 0 48-48 24Z"/>
    </g>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Rear of platform">
    <use href="#block" x="0.0" y="0.0"/>
    <use href="#block" x="-51.0" y="25.5"/>
    <use href="#block" x="51.0" y="25.5"/>
  </g>
  <g id="front" inkscape:groupmode="layer" inkscape:label="Front cube">
    <use href="#block" x="0.0" y="51.0"/>
  </g>
  <g id="arrival" inkscape:groupmode="layer" inkscape:label="Arriving cube">
    <use href="#block" x="-8.4" y="-79.6"/>
  </g>
</svg>
