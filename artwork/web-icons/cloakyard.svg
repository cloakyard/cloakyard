<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Cloakyard · The courtyard</title>
  <desc id="description">An apricot tree grows in the open roof of a cobalt courtyard. Two blue arches frame the way inside.</desc>
  <defs>
    <linearGradient id="porcelain" x2=".7" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff9e9"/><stop offset=".57" stop-color="#f2e7d3"/><stop offset="1" stop-color="#d4c5b4"/>
    </linearGradient>
    <linearGradient id="front" x2=".8" y2="1">
      <stop stop-color="#638dfa"/><stop offset=".5" stop-color="#3e66d6"/><stop offset="1" stop-color="#2946a4"/>
    </linearGradient>
    <linearGradient id="side" x2=".8" y2=".9">
      <stop stop-color="#405baa"/><stop offset="1" stop-color="#182d72"/>
    </linearGradient>
    <linearGradient id="roof" x2=".9" y2=".75">
      <stop stop-color="#c3defe"/><stop offset=".62" stop-color="#8fbbff"/><stop offset="1" stop-color="#6c9df7"/>
    </linearGradient>
    <radialGradient id="fruit" cx=".28" cy=".23" r=".86">
      <stop stop-color="#ffd484"/><stop offset=".5" stop-color="#f89b43"/><stop offset="1" stop-color="#dc542d"/>
    </radialGradient>
    <filter id="soft" x="-.4" y="-.8" width="1.8" height="2.6"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="court"><path d="m69 98 53-26 65 32-53 26Z"/></clipPath>
    <view id="light" viewBox="0 0 256 256"/>
    <view id="dark" viewBox="0 0 256 256"/>
    <view id="ground-light" viewBox="0 0 256 256"/>
    <view id="ground-dark" viewBox="0 0 256 256"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, #ground-light:target) { color-scheme: light }
      svg:has(#dark:target, #ground-dark:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target),
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      #porcelain stop:nth-child(1) { stop-color: light-dark(#fff9e9, #36455c) }
      #porcelain stop:nth-child(2) { stop-color: light-dark(#f2e7d3, #222e44) }
      #porcelain stop:nth-child(3) { stop-color: light-dark(#d4c5b4, #121d31) }
      #ground > rect:nth-of-type(2) { stroke: light-dark(#b7a795, #8aadc8) }
      #ground > path { stroke: light-dark(#fff9ed, #7e899c); opacity: .6 }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="01 · Porcelain">
    <rect x="5" y="5" width="246" height="246" rx="54" fill="url(#porcelain)"/>
    <rect x="6" y="6" width="244" height="244" rx="53" fill="none" stroke="#b7a795" stroke-opacity=".42"/>
    <path d="M12 76V60c0-29 19-47 47-48h75" fill="none" stroke="#fffdf4" stroke-opacity=".85" stroke-width="2"/>
  </g>
  <g id="terrace" inkscape:groupmode="layer" inkscape:label="02 · Stone terrace">
    <path d="m35 165 84-44 112 49-86 48Z" fill="#725f58" opacity=".38" filter="url(#soft)"/>
    <path d="m28 157 91-46 109 53v6l-92 47-108-54Z" fill="#ad9988"/>
    <path d="m28 157 92-46 108 53-92 47Z" fill="#e8d4af"/>
    <path d="m28 157 108 54 92-47" fill="none" stroke="#fff4d9" stroke-width="1.7"/>
    <path d="m43 98 79-39 94 46v57l-81 40-92-46Z" fill="#1a3062"/>
    <path d="m45 153 77-38 89 43-77 38Z" fill="#ce9f66"/>
    <path d="m71 149 28-14 59 29-28 14Z" fill="#f6c47c"/>
  </g>
  <g id="arcade" inkscape:groupmode="layer" inkscape:label="03 · Cobalt arcade">
    <!-- The arch reveals are recessed behind the two masonry faces. -->
    <path d="m40 96 94 46v64l-18-9v-28c0-15-9-29-22-35s-23 0-23 17v24l-31-15Z" fill="#263f87"/>
    <path d="m54 162 13-7v-17c0-21 14-30 29-22l19 10v64l-13 7-42-22Z" fill="#132b67"/>
    <path d="m40 96 94 46v65l-27-13v-25c0-15-9-30-22-36s-23 0-23 15v24l-22-11Z" fill="url(#front)"/>
    <path d="m62 172 9-5v-20c0-8 3-13 7-15-10-2-16 4-16 16Z" fill="#9bb9fc"/>
    <path d="m134 142 82-41v65l-19 9v-26c0-10-5-16-13-16-11 0-22 14-22 28v31l-28 15Z" fill="url(#side)"/>
    <path d="m187 136 2 2c4 3 5 9 5 16v23l3-2v-26c0-6-2-11-6-14Z" fill="#819ad9"/>
    <path d="m134 143 1 63" stroke="#9eb7fa" stroke-opacity=".53"/>
    <path d="m40 96 82-41 94 46-82 41Zm30 1 64 32 52-26-64-32Z" fill="url(#roof)" fill-rule="evenodd"/>
    <g clip-path="url(#court)">
      <path d="m68 97 54-27 66 33-54 27Z" fill="#294c99"/>
      <path d="m122 71 66 32-1 16-65-32Z" fill="#5074c1"/>
      <path d="m77 109 45-22 53 27-44 22Z" fill="#d0ae79"/>
      <path d="m89 99 52 25m-36-33 53 25m-74-4 46-23m-30 31 47-23" stroke="#947653" stroke-width="1" opacity=".46"/>
      <ellipse cx="139" cy="101" rx="16" ry="4" fill="#805943" opacity=".46"/>
    </g>
    <path d="m41 96 93 46 81-40m-144-5 51-26 64 32" fill="none" stroke="#d7e9ff" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
  <g id="tree" inkscape:groupmode="layer" inkscape:label="04 · Apricot topiary">
    <path d="M132 75h6v26q-3 3-6 0V89l-9-8 2-3 7 6Z" fill="#714b38"/>
    <path d="M133 77v22" stroke="#c79159" stroke-width="1.6"/>
    <path d="M134 29c10-2 18 5 21 14 7 5 9 16 5 23-1 11-10 18-19 18-7 4-18 2-23-3-10-1-15-10-13-18-3-8 1-19 8-23 4-9 12-13 21-11Z" fill="url(#fruit)"/>
    <path d="M110 53c1-5 4-9 8-11m3-5c3-3 6-4 10-4" fill="none" stroke="#ffe5a2" stroke-width="2" stroke-linecap="round" opacity=".74"/>
  </g>
</svg>
