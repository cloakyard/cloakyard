<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Cloakyard · Linked tiles</title>
  <desc id="description">Three connected cells and a detached square keep the family mark’s original arrangement. The shared cell and raised tile are solid.</desc>
  <defs>
    <view id="light" viewBox="0 0 64 64"/>
    <view id="dark" viewBox="0 0 64 64"/>
    <view id="ink" viewBox="0 0 64 64"/>
    <view id="ground-light" viewBox="0 0 64 64"/>
    <view id="ground-dark" viewBox="0 0 64 64"/>
    <view id="linked-light" viewBox="0 0 64 64"/>
    <view id="linked-dark" viewBox="0 0 64 64"/>
    <view id="tile-light" viewBox="0 0 64 64"/>
    <view id="tile-dark" viewBox="0 0 64 64"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display:none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display:none }
      svg:has(#linked-light:target, #linked-dark:target) > g:not(#linked) { display:none }
      svg:has(#tile-light:target, #tile-dark:target) > g:not(#tile) { display:none }
      [fill="#3465d5"] { fill:light-dark(#3465d5,#365fc0) }
      svg:has(#ink:target) #ground circle { fill:#263446 }
      svg:has(#ink:target) .face { fill:#fff }
      svg:has(#ink:target) .return { fill:#263446 }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Blue field">
    <circle cx="32" cy="32" r="30" fill="#3465d5"/>
  </g>
  <g id="linked" inkscape:groupmode="layer" inkscape:label="Connected tiles">
    <path class="face" fill="#fff" fill-rule="evenodd" d="M19.4 21.8h9.2q1.65 0 1.65 1.65V33.6h9.5q2.1 0 2.1 2.1v8.5q0 3.9-3.9 3.9H20.2q-4.6 0-4.6-4.6V25.65q0-3.85 3.8-3.85ZM19 25.3v8.3h7.85v-8.3Zm11.25 11.7v7.65h7.86V37Z"/>
    <path fill="#bed6ff" class="face" d="M18.96 36.97h7.9v7.72h-6.32q-1.58 0-1.58-1.61Z"/>
  </g>
  <g id="tile" inkscape:groupmode="layer" inkscape:label="Detached tile">
    <path class="face" fill="#fff" d="M35.3 15.85h10.35q2 0 2 2v10.4q0 1.45-1.45 1.45h-10.9q-1.5 0-1.5-1.5V17.35q0-1.5 1.5-1.5Z"/>
    <path class="return" fill="#bad3ff" d="m47.65 21.95-7.74 7.75h6.29q1.45 0 1.45-1.45Z"/>
  </g>
</svg>
