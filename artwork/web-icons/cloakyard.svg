<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="256" height="256" viewBox="-119 -71 238 238" role="img" aria-labelledby="title description">
  <title id="title">Cloakyard · Room to grow</title>
  <desc id="description">Six cubes in the landing animation’s settled arrangement, with an outlined seventh cell on the upper right.</desc>
  <defs>
    <view id="light" viewBox="-119 -71 238 238"/>
    <view id="dark" viewBox="-119 -71 238 238"/>
    <view id="ink" viewBox="-119 -71 238 238"/>
    <view id="ground-light" viewBox="-119 -71 238 238"/>
    <view id="ground-dark" viewBox="-119 -71 238 238"/>
    <view id="tier-light" viewBox="-119 -71 238 238"/>
    <view id="tier-dark" viewBox="-119 -71 238 238"/>
    <view id="future-light" viewBox="-119 -71 238 238"/>
    <view id="future-dark" viewBox="-119 -71 238 238"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg:has(> g:target) > g:not(:target) { display: none }
      svg:has(#ground-light:target, #ground-dark:target) > g:not(#ground) { display: none }
      svg:has(#tier-light:target, #tier-dark:target) > g:not(#tier) { display: none }
      svg:has(#future-light:target, #future-dark:target) > g:not(#future) { display: none }
      svg {
        --roof: light-dark(#c7dbff, #9bd2ff);
        --west: light-dark(#76a5fb, #578fc9);
        --east: light-dark(#315fd3, #2879bc);
        --join: light-dark(#eaf2ff, #183b5a);
        --edge: light-dark(#7299d4, #679cc6);
        --empty: light-dark(#f4f8ff, #25384e);
      }
      svg:has(#ink:target) {
        --roof: #fff;
        --west: #fff;
        --east: #202832;
        --join: #202832;
        --edge: #202832;
        --empty: #fff;
      }
      .cell { stroke: var(--join); stroke-width: 1.6; stroke-linejoin: round }
      .west { fill: var(--west) }
      .east { fill: var(--east) }
      .roof { fill: var(--roof) }
      .open { fill: var(--empty); stroke: var(--edge); stroke-width: 3.2; stroke-linejoin: round }
    </style>
    <g id="block" class="cell">
      <path class="west" d="M-48 24 0 48V104L-48 80Z"/>
      <path class="east" d="M0 48 48 24V80L0 104Z"/>
      <path class="roof" d="M0 0 48 24 0 48-48 24Z"/>
    </g>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Four lower cubes">
    <use href="#block" x="0.0" y="0.0"/>
    <use href="#block" x="-51.0" y="25.5"/>
    <use href="#block" x="51.0" y="25.5"/>
    <use href="#block" x="0.0" y="51.0"/>
  </g>
  <g id="tier" inkscape:groupmode="layer" inkscape:label="Two upper cubes">
    <use href="#block" x="0.0" y="-59.2"/>
    <use href="#block" x="-51.0" y="-33.7"/>
  </g>
  <g id="future" inkscape:groupmode="layer" inkscape:label="Open cell">
    <g class="open" transform="translate(51.0 -33.7)">
      <path d="M0 0 48 24V80L0 104 -48 80V24Z"/>
      <path fill="none" d="m-48 24 48 24 48-24M0 48v56"/>
    </g>
  </g>
</svg>
