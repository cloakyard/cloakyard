<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Cloakyard · Web app icon study</title>
    <link rel="stylesheet" href="review.css" />
    <script src="review.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Web app icons</h1>
          <p>Compare each current mark with its layered version.</p>
        </div>
        <label class="appearance" hidden
          >Appearance
          <select id="appearance">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select></label
        >
      </header>
      <section class="collection" aria-label="Icon designs and size comparisons">
        <article class="specimen" id="cloakyard">
          <h2>Cloakyard</h2>
          <p class="object-name">Overlapping panes</p>
          <div class="pair">
            <figure>
              <img
                class="original"
                src="../../public/cloakyard-mark.svg"
                width="256"
                height="256"
                alt="Current Cloakyard mark"
              />
              <figcaption>Current</figcaption>
            </figure>
            <figure>
              <a class="art-link" href="cloakyard.svg" aria-label="Open Cloakyard layered SVG"
                ><img
                  class="master"
                  width="256"
                  height="256"
                  src="cloakyard.svg"
                  alt="Two overlapping blue glass panes and a separate square on a blue disc."
              /></a>
              <figcaption>Refined</figcaption>
            </figure>
          </div>
          <div class="sizes" aria-label="Cloakyard size comparison">
            <figure>
              <div>
                <img
                  src="../../public/cloakyard-mark.svg"
                  width="36"
                  height="36"
                  alt="Current Cloakyard mark"
                />
              </div>
              <figcaption>Current · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  class="header-mark"
                  src="cloakyard.svg"
                  width="36"
                  height="36"
                  alt="Proposed Cloakyard header mark"
                />
              </div>
              <figcaption>Refined · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  src="tabs/cloakyard.svg"
                  width="16"
                  height="16"
                  alt="Redrawn Cloakyard tab icon"
                />
              </div>
              <figcaption>Tab · 16 px</figcaption>
            </figure>
          </div>
        </article>
        <article class="specimen" id="cloakpdf">
          <h2>CloakPDF</h2>
          <p class="object-name">Document shield</p>
          <div class="pair">
            <figure>
              <img
                class="original"
                src="../../public/brands/cloakpdf-mark.svg"
                width="256"
                height="256"
                alt="Current CloakPDF mark"
              />
              <figcaption>Current</figcaption>
            </figure>
            <figure>
              <a class="art-link" href="cloakpdf.svg" aria-label="Open CloakPDF layered SVG"
                ><img
                  class="master"
                  width="256"
                  height="256"
                  src="cloakpdf.svg"
                  alt="A white paper shield with a turned corner and three blue lines on a blue disc."
              /></a>
              <figcaption>Refined</figcaption>
            </figure>
          </div>
          <div class="sizes" aria-label="CloakPDF size comparison">
            <figure>
              <div>
                <img
                  src="../../public/brands/cloakpdf-mark.svg"
                  width="36"
                  height="36"
                  alt="Current CloakPDF mark"
                />
              </div>
              <figcaption>Current · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  class="header-mark"
                  src="cloakpdf.svg"
                  width="36"
                  height="36"
                  alt="Proposed CloakPDF header mark"
                />
              </div>
              <figcaption>Refined · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  src="tabs/cloakpdf.svg"
                  width="16"
                  height="16"
                  alt="Redrawn CloakPDF tab icon"
                />
              </div>
              <figcaption>Tab · 16 px</figcaption>
            </figure>
          </div>
        </article>
        <article class="specimen" id="cloakresume">
          <h2>CloakResume</h2>
          <p class="object-name">Profile shield</p>
          <div class="pair">
            <figure>
              <img
                class="original"
                src="../../public/brands/cloakresume-mark.svg"
                width="256"
                height="256"
                alt="Current CloakResume mark"
              />
              <figcaption>Current</figcaption>
            </figure>
            <figure>
              <a class="art-link" href="cloakresume.svg" aria-label="Open CloakResume layered SVG"
                ><img
                  class="master"
                  width="256"
                  height="256"
                  src="cloakresume.svg"
                  alt="An emerald shield with a pale portrait and résumé lines on a green disc."
              /></a>
              <figcaption>Refined</figcaption>
            </figure>
          </div>
          <div class="sizes" aria-label="CloakResume size comparison">
            <figure>
              <div>
                <img
                  src="../../public/brands/cloakresume-mark.svg"
                  width="36"
                  height="36"
                  alt="Current CloakResume mark"
                />
              </div>
              <figcaption>Current · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  class="header-mark"
                  src="cloakresume.svg"
                  width="36"
                  height="36"
                  alt="Proposed CloakResume header mark"
                />
              </div>
              <figcaption>Refined · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  src="tabs/cloakresume.svg"
                  width="16"
                  height="16"
                  alt="Redrawn CloakResume tab icon"
                />
              </div>
              <figcaption>Tab · 16 px</figcaption>
            </figure>
          </div>
        </article>
        <article class="specimen" id="cloakimg">
          <h2>CloakIMG</h2>
          <p class="object-name">Framed landscape</p>
          <div class="pair">
            <figure>
              <img
                class="original"
                src="../../public/brands/cloakimg-mark.svg"
                width="256"
                height="256"
                alt="Current CloakIMG mark"
              />
              <figcaption>Current</figcaption>
            </figure>
            <figure>
              <a class="art-link" href="cloakimg.svg" aria-label="Open CloakIMG layered SVG"
                ><img
                  class="master"
                  width="256"
                  height="256"
                  src="cloakimg.svg"
                  alt="A warm white picture frame around two overlapping coral peaks and a sun."
              /></a>
              <figcaption>Refined</figcaption>
            </figure>
          </div>
          <div class="sizes" aria-label="CloakIMG size comparison">
            <figure>
              <div>
                <img
                  src="../../public/brands/cloakimg-mark.svg"
                  width="36"
                  height="36"
                  alt="Current CloakIMG mark"
                />
              </div>
              <figcaption>Current · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  class="header-mark"
                  src="cloakimg.svg"
                  width="36"
                  height="36"
                  alt="Proposed CloakIMG header mark"
                />
              </div>
              <figcaption>Refined · 36 px</figcaption>
            </figure>
            <figure>
              <div>
                <img
                  src="tabs/cloakimg.svg"
                  width="16"
                  height="16"
                  alt="Redrawn CloakIMG tab icon"
                />
              </div>
              <figcaption>Tab · 16 px</figcaption>
            </figure>
          </div>
        </article>
      </section>
      <section class="inspector" id="inspector" aria-labelledby="inspector-heading" hidden>
        <div class="inspector-heading">
          <div>
            <h2 id="inspector-heading">Layer inspector</h2>
            <p>Choose an icon and lift away its layers.</p>
          </div>
          <label
            >Product
            <select id="product">
              <option value="cloakyard">Cloakyard</option>
              <option value="cloakpdf">CloakPDF</option>
              <option value="cloakresume">CloakResume</option>
              <option value="cloakimg">CloakIMG</option>
            </select></label
          >
        </div>
        <div class="workbench">
          <div class="stage" id="stage" aria-hidden="true"></div>
          <div class="controls">
            <h3 id="object-name"></h3>
            <p id="description"></p>
            <fieldset id="layers"><legend>Visible layers, back to front</legend></fieldset>
            <label class="spread"
              ><input type="checkbox" id="spread" checked /> Spread layers apart</label
            >
            <div class="sources">
              <a id="master-source">Layered SVG</a><a id="tab-source">16 px SVG</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
