<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title description">
  <title id="title">CloakPDF · Folded report at 16 pixels</title>
  <desc id="description">A white folded report on a blue enamel disc, with printed lines and a two-column table.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="light-dark(#83c8ff, #599cce)"/>
      <stop offset=".47" stop-color="light-dark(#327de5, #285c9a)"/>
      <stop offset="1" stop-color="light-dark(#194db0, #1c3870)"/>
    </linearGradient>
    <view id="light" viewBox="0 0 16 16"/>
    <view id="dark" viewBox="0 0 16 16"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
    </style>
  </defs>
  <g id="disc" inkscape:groupmode="layer" inkscape:label="Enamel disc">
    <circle id="disc-base" cx="8" cy="8" r="7.5" fill="url(#enamel)"/>
  </g>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Backing">
    <path d="m3.8 4.4 5.6-1 .3 1.7 1.5.1.7 6.5-6.7 1.05Z" fill="#173a78"/>
  </g>
  <g id="page" inkscape:groupmode="layer" inkscape:label="Report sheet">
    <path d="M5 3h4.6l2.05 2.05V13H5Z" fill="#fff"/>
    <path d="M9.6 3.1v2.2h2" fill="#d9dfe4"/>
  </g>
  <g id="print" inkscape:groupmode="layer" inkscape:label="Printed lines and table">
    <path d="M6.1 5.25h2.25M6.1 6.6h3.6" stroke="#345078" stroke-width=".75" stroke-linecap="round"/>
    <path d="M6.1 8.1h4.5v3.5H6.1Zm2.65 0v3.5M6.1 9.8h4.5" fill="none" stroke="#315186" stroke-width=".75"/>
  </g>
</svg>
