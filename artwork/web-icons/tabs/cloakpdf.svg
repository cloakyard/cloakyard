<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title description">
  <title id="title">CloakPDF · Bound report at 16 pixels</title>
  <desc id="description">A cobalt-bound report with warm paper, a narrow amber bookmark, short printed lines and a ruled table.</desc>
  <defs>
    <view id="light" viewBox="0 0 16 16"/>
    <view id="dark" viewBox="0 0 16 16"/>
    <style>
      svg { color-scheme: light dark }
      svg:has(#light:target, view[id$="-light"]:target) { color-scheme: light }
      svg:has(#dark:target, view[id$="-dark"]:target) { color-scheme: dark }
      svg {
        --ink: light-dark(#163675, #183970);
        --grid: light-dark(#335da5, #315995);
        --leaf: light-dark(#fffef6, #f6f5ed);
        --cover: light-dark(#2253af, #1d447f);
        --amber: light-dark(#ffc66c, #ffbe61);
      }
    </style>
  </defs>
  <g id="ground" inkscape:groupmode="layer" inkscape:label="Cover">
    <rect x="1" y=".5" width="14" height="15" rx="2" fill="var(--cover)"/>
  </g>
  <g id="page" inkscape:groupmode="layer" inkscape:label="Paper and ribbon">
    <path d="M10 12h2v4l-1-.6-1 .6Z" fill="var(--amber)"/>
    <path d="M4 2h9.5v11.5H4Z" fill="var(--leaf)"/>
  </g>
  <g id="print" inkscape:groupmode="layer" inkscape:label="Ink">
    <path d="M5.5 4h4m-4 2h6" fill="none" stroke="var(--ink)" stroke-linecap="round"/>
    <path d="M5.5 8h6.5v4H5.5ZM9 8v4m-3.5-2H12" fill="none" stroke="var(--grid)"/>
  </g>
</svg>
