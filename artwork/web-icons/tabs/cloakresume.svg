    <path data-ink="" fill="#ccd4d9" d="M7.15 4.3 7.7 3.3h1.92v1Zm3.1 0 .57-1.18h1.82v1.18Z"/>
  </g>
  <g id="card" inkscape:groupmode="layer" inkscape:label="Card" transform="translate(1.6 1.6) scale(.8)">
    <path data-ink="" fill="#fff" fill-rule="evenodd" d="M2.14 3.81h3.12l1.02 1.15h7.63v7.89H2.14ZM5.44 5.97a.88.88 0 1 0 .01 0Zm-1.65 3.27q.18-1.29 1.62-1.29t1.64 1.29Zm4.42-2.71v.9h3.85v-.9Zm0 1.83v.89h2.63v-.89Zm-4.3 2.21v.92h8.15v-.92Z"/>
