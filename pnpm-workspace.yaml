allowBuilds:
  esbuild: true
  workerd: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - wrangler@4.148.0
  - miniflare@5.20261006.0-alpha
  - workerd@1.20261006.1
  - "@cloudflare/workerd-darwin-arm64@1.20261006.1"
  - "@cloudflare/workerd-darwin-64@1.20261006.1"
  - "@cloudflare/workerd-linux-64@1.20261006.1"
  - "@cloudflare/workerd-linux-arm64@1.20261006.1"
  - "@cloudflare/workerd-windows-64@1.20261006.1"
  - miniflare@4.20260722.1 || 5.20260804.1-alpha
  - "@voidzero-dev/vite-plus-core@0.2.9 || 1.1.0"
  - vite-plus@0.2.9 || 1.1.0
  - wrangler@4.121.0
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.9 || 1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.9 || 1.1.0"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
  # Miniflare's pinned image decoder predates the librsvg security fix.
  "miniflare>sharp": 0.35.5
