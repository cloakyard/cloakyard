<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title description" data-logo-spec="cloakyard-mark-v2">
  <title id="title">Cloakyard</title>
  <desc id="description">The landing animation’s settled blue cubes and open next cell on an indigo disc.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop id="enamel-light" stop-color="#96baff"/>
      <stop id="enamel-mid" offset=".47" stop-color="#4569d6"/>
      <stop id="enamel-deep" offset="1" stop-color="#263fa4"/>
    </linearGradient>
    <symbol id="solid" viewBox="-49 -1 98 106" overflow="visible" stroke-linejoin="round" stroke-width="1">
      <path id="solid-0" d="M-48 24 0 48V104L-48 80Z" fill="#709cf9" stroke="#c0d3fc"/>
      <path id="solid-1" d="M0 48 48 24V80L0 104Z" fill="#376ee6" stroke="#c0d3fc"/>
      <path id="solid-2" d="M0 0 48 24 0 48-48 24Z" fill="#dfe9fe" stroke="#c0d3fc"/>
    </symbol>
    <symbol id="open" viewBox="-49 -1 98 106" overflow="visible" stroke-linejoin="round" stroke-width="6">
      <path id="open-0" d="M-48 24 0 48V104L-48 80Z" fill="#f4f7fc" stroke="#c4d5fa"/>
      <path id="open-1" d="M0 48 48 24V80L0 104Z" fill="#f4f7fc" stroke="#c4d5fa"/>
      <path id="open-2" d="M0 0 48 24 0 48-48 24Z" fill="#f4f7fc" stroke="#c4d5fa"/>
    </symbol>
    <style>
      @media (prefers-color-scheme: dark) {
        #enamel-light { stop-color: #6b89cd }
        #enamel-mid { stop-color: #364c91 }
        #enamel-deep { stop-color: #23316b }
        #solid-0 { fill: #5795c1; stroke: #355269 }
        #solid-1 { fill: #79c7fe; stroke: #355269 }
        #solid-2 { fill: #283846; stroke: #355269 }
        #open-0 { fill: #13171d; stroke: #2b4457 }
        #open-1 { fill: #13171d; stroke: #2b4457 }
        #open-2 { fill: #13171d; stroke: #2b4457 }
      }
    </style>
  </defs>
  <g id="disc">
    <circle cx="8" cy="8" r="7.5" fill="url(#enamel)"/>
  </g>
  <g id="artwork">
    <use href="#solid" x="5.509" y="5.509" width="4.981" height="5.396"/>
    <use href="#solid" x="2.915" y="6.807" width="4.981" height="5.396"/>
    <use href="#solid" x="8.104" y="6.807" width="4.981" height="5.396"/>
    <use href="#solid" x="5.509" y="8.104" width="4.981" height="5.396"/>
    <use href="#solid" x="5.509" y="2.5" width="4.981" height="5.396"/>
    <use href="#solid" x="2.915" y="3.797" width="4.981" height="5.396"/>
    <use href="#open" x="8.104" y="3.797" width="4.981" height="5.396"/>
